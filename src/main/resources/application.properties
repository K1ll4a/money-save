spring.application.name=api-test
server.port=8080
server.servlet.context-path=/api
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:change-me-super-secret-jwt-key-32-bytes}
app.auth.refresh-pepper=${APP_AUTH_REFRESH_PEPPER:change-me-refresh-pepper-32-bytes}
app.auth.access-token-ttl-seconds=${APP_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
app.auth.refresh-token-ttl-seconds=${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:api_test}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-test-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-api_test}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-api_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-test-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-api_test}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-change-me-super-secret-jwt-key-32-bytes}
      APP_AUTH_REFRESH_PEPPER: ${APP_AUTH_REFRESH_PEPPER:-change-me-refresh-pepper-32-bytes}
      APP_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${APP_AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      APP_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
